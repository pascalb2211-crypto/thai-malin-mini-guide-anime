us:15px}}.bullet{{font-size:14px}}.check{{width:23px;height:23px;font-size:14px;flex-basis:23px}}.tip{{padding:10px 12px;margin-top:8px}}.tip p{{font-size:13px}}.footer{{font-size:10px;padding:7px 10px}}.pagebadge{{width:52px;height:52px;font-size:28px;top:12px;left:12px}}.coverTitle{{left:8%;top:12%;font-size:34px}}.coverTitle span{{font-size:17px}}.coverNote{{right:12px;top:30px;max-width:170px;font-size:13px;padding:11px}}.bottom{{height:36px;font-size:10px}}}}

</style></head><body><div class="app"><div class="top"><div class="brand">🌺 THAÏ <span>MALIN</span><small>Mini-guide Réunionnais</small></div><button class="navbtn" id="prev">←</button><div class="counter" id="counter">1 / 20</div><button class="navbtn" id="next">→</button><div class="grow"></div><button class="labelbtn" id="sum">☷ &nbsp;Sommaire</button><button class="labelbtn" id="pdf">↓ &nbsp;PDF</button><button class="labelbtn" id="fav">♡ &nbsp;Favoris</button><button class="navbtn" id="full">⛶</button></div><div class="reader"><aside class="sidebar" id="sidebar"></aside><main class="stage"><div class="book" id="book"></div></main></div><div class="bottom">👆 Glisse à gauche ou à droite pour changer de page · 🔍 Zoom pour lire · 🇷🇪 Réunion Malin</div></div><div class="modal" id="modal"><div class="panel"><button class="close" id="close">×</button><h2>📋 Sommaire</h2><div class="gridlinks" id="links"></div></div></div><script>
const pages=[{"n": 1, "title": "Bienvenue en Thaïlande", "icon": "🌺", "subtitle": "Le mini-guide Réunionnais", "bullets": ["Plages, temples, gastronomie et bons plans", "Les essentiels avant le départ", "Des conseils pensés pour les voyageurs de La Réunion"], "tip_title": "Réunion Malin 🇷🇪", "tip": "La Thaïlande comme un Réunionnais : simple, pratique et avec le sourire !"}, {"n": 2, "title": "Avant de partir", "icon": "✈️", "subtitle": "Les essentiels à vérifier depuis La Réunion", "bullets": ["Choisir la bonne période", "Comparer les prix des vols", "Vérifier les documents et formalités", "Préparer la valise", "Prévoir le budget", "Créer une checklist personnelle"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Un bon départ, c’est déjà la moitié du voyage ! 😎"}, {"n": 3, "title": "Documents & TDAC", "icon": "🛂", "subtitle": "Les documents à préparer", "bullets": ["Passeport en cours de validité et documents de voyage", "TDAC : formulaire d’arrivée numérique à remplir avant l’entrée", "Conserver une copie numérique du passeport et des réservations", "Garder les confirmations de vol et d’hébergement accessibles", "Vérifier les règles officielles avant chaque départ"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Je mets tout dans mon téléphone… et dans le cloud, comme ça je suis tranquille ! 😎"}, {"n": 4, "title": "Visa & Entrée en Thaïlande", "icon": "🛃", "subtitle": "Comprendre les conditions d’entrée", "bullets": ["Pour un passeport français, vérifier le régime d’exemption de visa en vigueur à la date du voyage", "Le régime et la durée autorisée peuvent évoluer : consulter l’Ambassade royale de Thaïlande", "Si un visa est nécessaire, préparer le dossier suffisamment tôt", "À l’arrivée, respecter la durée de séjour accordée par l’immigration", "Ne pas confondre TDAC et visa : le TDAC est une formalité d’arrivée"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Pas besoin de visa ne veut pas dire pas de formalités 😉"}, {"n": 5, "title": "Vols & Réservations", "icon": "🎫", "subtitle": "Réserver malin depuis La Réunion", "bullets": ["Comparer plusieurs moteurs et compagnies", "Vérifier bagages inclus, horaires et escales", "Regarder les conditions de modification et d’annulation", "Comparer aussi les vols intérieurs en Thaïlande", "Garder toutes les confirmations dans un même dossier"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Je check plusieurs sites avant de réserver. Les bons plans existent, il faut juste un peu de patience !"}, {"n": 6, "title": "Assurance voyage", "icon": "🛡️", "subtitle": "Une petite dépense qui peut éviter une grosse galère", "bullets": ["Vérifier les frais médicaux et hospitalisation couverts", "Contrôler assistance, rapatriement et responsabilité civile", "Lire les exclusions avant de partir", "Vérifier la couverture des activités prévues", "Conserver le numéro d’assistance et les documents du contrat"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Une petite dépense maintenant peut t’éviter de gros soucis plus tard. Mieux vaut prévenir !"}, {"n": 7, "title": "eSIM & Internet", "icon": "📶", "subtitle": "Rester connecté partout en Thaïlande", "bullets": ["Pourquoi prendre une eSIM ?", "Comparer les forfaits data et la durée", "Installer l’eSIM avant le départ si possible", "Vérifier la couverture dans les zones prévues", "Autres options : SIM locale ou Wi-Fi"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Internet sert pour les cartes, traductions, réservations… et envoyer les photos à la famille !"}, {"n": 8, "title": "Mon argent en Thaïlande", "icon": "💰", "subtitle": "Cartes, retraits et budget", "bullets": ["Choisir une carte bancaire adaptée aux voyages", "Vérifier les frais de paiement et de retrait", "Prévoir un peu de cash en bahts", "Estimer son budget quotidien selon son style de voyage", "Utiliser les paiements sans contact quand ils sont acceptés"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Toujours avoir un peu de cash : ça peut sauver la mise quand le terminal ne suit pas !"}, {"n": 9, "title": "Ma valise", "icon": "🧳", "subtitle": "La checklist essentielle", "bullets": ["Vêtements légers et respirants", "Sandales + chaussures adaptées aux visites", "Maillot, protection solaire et petite trousse santé", "Adaptateur, chargeurs et batterie externe", "Copies numériques des documents importants"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Léger dans la valise, lourd en souvenirs ! 😄"}, {"n": 10, "title": "Arrivée en Thaïlande", "icon": "🛬", "subtitle": "Les premières étapes après l’atterrissage", "bullets": ["Passer l’immigration et récupérer ses bagages", "Retrouver le transfert ou rejoindre son moyen de transport", "Activer la data/eSIM et vérifier les applications utiles", "Retirer ou changer une petite somme si nécessaire", "Rejoindre l’hôtel puis prendre le temps de souffler"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Pas besoin de courir : prends tes repères et profite déjà de l’ambiance !"}, {"n": 11, "title": "Se déplacer en Thaïlande", "icon": "🛺", "subtitle": "Les moyens de transport", "bullets": ["Comparer avion, train, bus, bateau et transferts privés", "Réserver les longs trajets à l’avance quand la demande est forte", "Utiliser Grab et les applications de cartes pour les trajets urbains", "Pour les îles, vérifier horaires et météo des bateaux", "Toujours prévoir un peu de marge entre deux correspondances"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Une fois qu’on a compris les transports, c’est facile… et l’aventure commence ! 😄"}, {"n": 12, "title": "Se loger", "icon": "🏨", "subtitle": "Hôtels, guesthouses, resorts et bons plans", "bullets": ["Comparer les hébergements et les avis récents", "Regarder l’emplacement avant le prix seul", "Vérifier petit-déjeuner, transfert et conditions d’annulation", "Choisir le quartier selon les activités prévues", "Comparer les offres directes et plateformes"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Du petit guesthouse au resort de rêve, il y en a pour tous les budgets !"}, {"n": 13, "title": "Manger en Thaïlande", "icon": "🍜", "subtitle": "Street-food, marchés et restaurants", "bullets": ["Goûter les spécialités locales progressivement", "Choisir les stands avec beaucoup de rotation", "Demander le niveau de piment : mai phet si besoin", "Tester marchés, food courts et restaurants locaux", "Boire de l’eau en bouteille si tu préfères éviter les mauvaises surprises"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Le piment thaï, c’est pas une compétition… sauf si tu veux transpirer avant le dessert ! 🌶️"}, {"n": 14, "title": "Visiter les incontournables", "icon": "🏝️", "subtitle": "Temples, îles, nature et patrimoine", "bullets": ["Temples et lieux culturels emblématiques", "Plages et îles paradisiaques", "Marchés et quartiers animés", "Parcs nationaux et paysages naturels", "Alterner visites, pauses et moments libres"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Ne remplis pas toutes tes journées : la Thaïlande se savoure aussi tranquillement !"}, {"n": 15, "title": "Itinéraires recommandés", "icon": "🗺️", "subtitle": "Des idées selon la durée du séjour", "bullets": ["Circuit 7 jours : Bangkok + Ayutthaya", "Circuit 10 jours : Bangkok + Nord (Chiang Mai)", "Circuit 15 jours : Grand tour du Sud / Andaman", "Circuit 21 jours : combiné Nord + Centre + Sud", "30 jours : immersion plus complète et rythme plus doux"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Choisis selon ton rythme : courir partout ou prendre le temps, les deux sont possibles !"}, {"n": 16, "title": "Conseils pratiques au quotidien", "icon": "💡", "subtitle": "Santé, sécurité, applications et réflexes", "bullets": ["Santé et trousse de secours", "Sécurité et précautions de base", "Applications utiles : Maps, Grab, traduction, météo", "Comportements à adopter dans les lieux publics", "Numéros importants à conserver"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Avec deux-trois bons réflexes, tu peux voyager beaucoup plus tranquille !"}, {"n": 17, "title": "Culture & Traditions", "icon": "🙏", "subtitle": "Comprendre la Thaïlande et ses habitants", "bullets": ["Le bouddhisme au quotidien", "Les traditions et coutumes", "Le respect des locaux et des lieux sacrés", "Les fêtes et festivals", "Les petits gestes qui font la différence"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Un sourire, un wai et un peu de respect : tu seras bien accueilli !"}, {"n": 18, "title": "Shopping & Souvenirs", "icon": "🛍️", "subtitle": "Que ramener de Thaïlande ?", "bullets": ["Marchés incontournables", "Idées de cadeaux et souvenirs", "Centres commerciaux et marchés de nuit", "Astuces pour bien négocier", "Produits à éviter ou à vérifier avant d’acheter"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Pense aux petits cadeaux… mais garde une place dans la valise ! 😄"}, {"n": 19, "title": "Idées d’excursions et activités", "icon": "🌊", "subtitle": "Nature, mer, bien-être et expériences", "bullets": ["Excursions en mer et îles", "Nature et parcs nationaux", "Activités insolites", "Bien-être : spa et massages", "Expériences authentiques et rencontres locales"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Sors des sentiers battus : la Thaïlande réserve de belles surprises !"}, {"n": 20, "title": "Numéros utiles & SOS", "icon": "🆘", "subtitle": "Les contacts à garder sous la main", "bullets": ["Numéros d’urgence en Thaïlande", "Ambassade et consulat", "Contacts utiles : police, secours et assistance", "Que faire en cas de perte ou de vol", "Applications et services utiles pour demander de l’aide"], "tip_title": "Réunion Malin 🇷🇪", "tip": "Garde ces infos dans ton téléphone. On espère ne jamais en avoir besoin !"}];
let current=1;
const book=document.getElementById('book'), sidebar=document.getElementById('sidebar'), counter=document.getElementById('counter');
function pageHTML(p){{ if(p.n===1) return `<section class="page active page1"><div class="coverTitle">THAÏ MALIN<span>Mini-guide Réunionnais</span></div><div class="coverNote">🇷🇪 Réunion Malin<br><span style="font-weight:700">La Thaïlande comme un Réunionnais !</span> 😎</div><div class="footer"><span>Bienvenue en Thaïlande 🇹🇭</span><span>Prépare · Voyage · Profite</span></div></section>`;
return `<section class="page" data-page="${p.n}"><div class="pagebadge">${p.n}</div><div class="content"><div class="left"><div class="kicker">${p.icon} ${p.n < 10 ? 'L’essentiel' : 'À savoir'}</div><h1>${p.title}</h1><div class="subtitle">${p.subtitle}</div><div class="bullets">${p.bullets.map(x=>`<div class="bullet"><span class="check">✓</span><span>${x}</span></div>`).join('')}</div><div class="tip"><b>${p.tip_title}</b><p>${p.tip}</p></div></div><div class="hero"><img src="assets/hero-${String(p.n).padStart(2,'0')}.webp" alt="Illustration ${p.title}"></div></div><div class="footer"><span>THAÏ MALIN 🌺 · Mini-guide Réunionnais</span><span>${p.n} / 20</span></div></section>`}}
book.innerHTML=pages.map(pageHTML).join('');
sidebar.innerHTML=pages.map(p=>`<div class="thumb ${p.n===1?'active':''}" data-n="${p.n}"><img src="${p.n===1?'assets/page-01.webp':`assets/hero-${String(p.n).padStart(2,'0')}.webp`}"><div>${p.n}. ${p.title}</div></div>`).join('');
const sections=[...document.querySelectorAll('.page')];
function show(n){{current=Math.max(1,Math.min(20,n));sections.forEach((s,i)=>s.classList.toggle('active',i===current-1));document.querySelectorAll('.thumb').forEach(t=>t.classList.toggle('active',+t.dataset.n===current));counter.textContent=`${current} / 20`;}}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.querySelectorAll('.thumb').forEach(t=>t.onclick=()=>show(+t.dataset.n));
let sx=0;book.addEventListener('touchstart',e=>sx=e.touches[0].clientX);book.addEventListener('touchend',e=>{{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(current+(dx<0?1:-1));}});
document.addEventListener('keydown',e=>{{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);}});
const modal=document.getElementById('modal');document.getElementById('sum').onclick=()=>{{document.getElementById('links').innerHTML=pages.map(p=>`<div class="link" onclick="show(${{p.n}});modal.classList.remove('show')">${{p.n}} · ${{p.title}}</div>`).join('');modal.classList.add('show')}};document.getElementById('close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{{if(e.target===modal)modal.classList.remove('show')}};
document.getElementById('pdf').onclick=()=>window.print();document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
let fav=false;document.getElementById('fav').onclick=e=>{{fav=!fav;e.target.textContent=fav?'♥  Favori ajouté':'♡  Favoris'}};
show(1);
</script></body></html>
